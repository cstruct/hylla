[package]
name = "hylla-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "hylla"
path = "src/main.rs"

[dependencies]
hylla-config = { path = "../config" }
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
foyer = "0.22.6"
futures = "0.3.34"
http = "1.5.0"
mixtrics = { version = "0.2.6", features = ["opentelemetry_0_33"] }
opentelemetry = { version = "0.33.1", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde_json = "1.0.154"
httpdate = "1.0.3"
object_store = { version = "0.14.2", features = ["aws", "azure"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic-messages", "metrics"] }
prost = "0.14.4"
base64 = "0.23.1"
async-trait = "0.1.92"
tower = { version = "0.5.3", features = ["util"] }
