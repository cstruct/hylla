[package]
name = "hylla-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "hylla"
path = "src/main.rs"

[dependencies]
hylla-config = { path = "../config" }
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
foyer = "0.22.6"
futures = "0.3.34"
http = "1.5.0"
httpdate = "1.0.3"
object_store = { version = "0.14.2", features = ["aws"] }
percent-encoding = "2.3.2"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1.92"
tower = { version = "0.5.3", features = ["util"] }
