[package]
name = "hylla-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
ordna-core = "0.1.0"
ordna-source-env = "0.1.0"
ordna-source-file = "0.1.0"
ordna-source-yaml = "0.1.0"
humantime = "2.4.0"
regex = "1.13.1"
# Needed by `#[config(path = ...)]` and `#[facet(tag = ...)]`, see ordna's macros.
facet = { version = "0.46.5", features = ["net"] }

[lints.clippy]
# Loading config fails with ordna's ConfigLoadError, which is large, but only once, at startup.
result_large_err = "allow"
