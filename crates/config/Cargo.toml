[package]
name = "hylla-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
ordna-core = { path = "../../../ordna/crates/core" }
ordna-source-env = { path = "../../../ordna/crates/source-env" }
ordna-source-file = { path = "../../../ordna/crates/source-file" }
ordna-source-yaml = { path = "../../../ordna/crates/source-yaml" }
humantime = "2.4.0"
regex = "1.13.1"
# Needed by `#[config(path = ...)]` and `#[facet(tag = ...)]`, see ordna's macros.
facet = { version = "0.46.5", features = ["net"] }
