[package]
name = "hylla-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ordna-core = "0.1.3"
ordna-source-env = "0.1.3"
ordna-source-file = "0.1.3"
ordna-source-styx = "0.1.3"
facet-styx = "4.0.0"
facet-value = "0.46.0"
humantime = "2.4.0"
regex = "1.13.1"
# Needed by `#[config(path = ...)]` and `#[facet(tag = ...)]`, see ordna's macros, and
# for reflection when showing the effective config.
facet = { version = "0.46.5", features = ["net", "reflect"] }

[lints.clippy]
# Loading config fails with ordna's ConfigLoadError, which is large, but only once, at startup.
result_large_err = "allow"
