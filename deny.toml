# What `cargo deny check` allows of the dependencies, run in CI.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, unmaintained crates included, until it's fixed or
# listed here with why it doesn't apply.
version = 2
ignore = [
  # A proc macro leptos uses, finished rather than abandoned, with no replacement upstream.
  { id = "RUSTSEC-2024-0436", reason = "paste is only used at compile time, through leptos" },
  # foyer 0.22, the latest, pins zstd 0.13, and hylla never turns on its compression, so
  # zstd never decompresses anything.
  { id = "RUSTSEC-2026-0391", reason = "zstd is unused: foyer's compression is off" },
  { id = "RUSTSEC-2026-0398", reason = "zstd is unused: foyer's compression is off" },
  { id = "RUSTSEC-2026-0403", reason = "zstd is unused: foyer's compression is off" },
]

[licenses]
version = 2
# Permissive licenses only.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

# hylla's own crates aren't published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates, by path.
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
