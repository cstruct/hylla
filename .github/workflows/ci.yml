name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust, tracey, cargo-deny, actionlint and the end-to-end tests' VersityGW and Azurite,
      # as pinned in mise.toml.
      - name: Install tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # Saved at the end of the job, see below.
      - name: Restore the Cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-

      # Formatting, dependencies, clippy (native and the UI's WASM build), the
      # workflows and spec references.
      - name: Lint
        if: runner.os == 'Linux'
        run: mise run lint

      # So the tests run with the UI's hydration bundle embedded, as releases do.
      - name: Build the UI's hydration bundle
        if: runner.os == 'Linux'
        run: mise run ui

      - name: Run tests
        run: mise run test

      - name: Run end-to-end tests
        if: runner.os == 'Linux'
        run: mise run e2e

      # Not from tags: a tag's caches are only visible to that tag's runs, so they would
      # only evict the ones pull requests use.
      - name: Save the Cargo cache
        if: github.ref_type != 'tag' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
