name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against Cargo.toml
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match the workspace version v{version}")
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY

  ci:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04, so the binaries run with glibc 2.35 and later, such as on
          # Debian 12 and Ubuntu 22.04.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Rust and wasm-bindgen, as pinned in mise.toml, not the end-to-end tests' tools.
      - name: Install Rust
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust github:wasm-bindgen/wasm-bindgen

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ matrix.target }}-

      # Embedded in the binary, so the control plane's UI is hydrated.
      - name: Build the UI's hydration bundle
        run: mise run ui

      - name: Build release binary
        run: cargo build --locked --release --bin hylla --target "$TARGET"

      - name: Smoke test release binary
        run: '"target/$TARGET/release/hylla" --version'

      - name: Package binary
        run: |
          archive="hylla-$TAG_NAME-$TARGET"
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/hylla" README.md "dist/$archive/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docker:
    name: Docker image
    needs: [validate, ci]
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs: [validate, build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'cstruct/hylla' }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease)
          fi
          notes="Docker image: \`$IMAGE:${TAG_NAME#v}\`, for linux/amd64 and linux/arm64."
          gh release create "$TAG_NAME" dist/* \
            --verify-tag --generate-notes --notes "$notes" --title "$TAG_NAME" "${flags[@]}"
