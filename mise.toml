[tools]
# The Rust toolchain, installed through rustup.
rust = { version = "1.99.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
# Tracks the spec in docs/spec against the code, from its GitHub releases.
"github:bearcove/tracey" = "1.4.0"
# Binds the control plane UI's WASM bundle, see `mise run ui`. It must match the
# wasm-bindgen crate in crates/control exactly.
"github:wasm-bindgen/wasm-bindgen" = "0.2.128"
# Checks the dependencies for security advisories, licenses and sources, see deny.toml.
"github:EmbarkStudios/cargo-deny" = "0.19.9"
# Lints the GitHub Actions workflows.
"github:rhysd/actionlint" = "1.7.7"

# Tools for the end-to-end tests, see `mise run e2e`.
# An S3 compatible gateway serving a local directory, from its GitHub releases.
"github:versity/versitygw" = "1.9.0"
# A local Azure Blob Storage emulator. It publishes no binaries on GitHub, only an npm
# package, so it's installed with mise's npm backend.
node = "24"
"npm:azurite" = "3.37.0"

[tasks.deny]
description = "Check the dependencies for security advisories, licenses and sources"
run = "cargo deny --locked check"

[tasks.lint]
description = "Check formatting, dependencies, lints, the CI workflows and spec references"
run = [
  "cargo fmt --all -- --check",
  "cargo deny --locked check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo clippy --locked -p hylla-control --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings",
  "actionlint",
  "tracey query validate",
]

[tasks.test]
description = "Run the tests, without the end-to-end tests"
run = "cargo test --locked --workspace --all-features"

[tasks.e2e]
description = "Run the end-to-end tests against VersityGW and Azurite"
run = "cargo test -p hylla-server --test e2e -- --ignored --test-threads=1"

[tasks.ui]
description = "Build the control plane UI's hydration bundle into target/site/pkg, which hylla embeds"
run = [
  "cargo build --locked --profile ui -p hylla-control --lib --target wasm32-unknown-unknown --features hydrate",
  "wasm-bindgen --target web --no-typescript --out-dir target/site/pkg --out-name hylla target/wasm32-unknown-unknown/ui/hylla_control.wasm",
]

[tasks."release:bump"]
description = "Set the release version everywhere it is recorded, then commit, tag and push the release"
usage = 'arg "<version>" help="The new version, such as 1.3.0 or 1.3.0-rc.1"'
run = """
set -eu
version=${usage_version?}
echo "$version" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Not a version: $version" >&2; exit 1; }
# The release commit should hold only the bump.
test -z "$(git status --porcelain)" || { echo "The working tree has uncommitted changes" >&2; git status --short >&2; exit 1; }
# Releases are made from main.
test "$(git branch --show-current)" = main || { echo "Not on main" >&2; exit 1; }
git pull -q --ff-only
test "$(grep -c '^version = ' Cargo.toml)" = 1
perl -pi -e "s/^version = \\"[^\\"]*\\"/version = \\"$version\\"/" Cargo.toml
cargo update -q --workspace
git commit -q -am "Release $version"
git push origin HEAD
git tag -a "v$version" -m "Hylla $version"
git push origin "v$version"
"""
