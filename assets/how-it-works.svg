<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-label="How hylla serves a request: it picks a server by Host, a mapping by path prefix and that mapping's backend, then reads the object's chunks from memory, then disk, and fetches them from the bucket on a miss.">
  <style>
    .fg { fill: #10202B; }
    .muted { fill: #4A5A63; }
    .accent { fill: #2F7D6D; }
    .on-accent { fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #10202B; stroke-width: 1.5; }
    .panel { fill: #F2F4F1; stroke: #C9D1CC; stroke-width: 1.5; }
    .line { stroke: #10202B; stroke-width: 1.5; fill: none; }
    .rail { stroke: #C9D1CC; stroke-width: 2; }
    .head { fill: #10202B; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .label { font-weight: 600; font-size: 15px; }
    .title { font-weight: 700; font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      .fg, .head { fill: #F2F4F1; }
      .muted { fill: #A7B3B0; }
      .box { fill: #10202B; stroke: #F2F4F1; }
      .panel { fill: #16262F; stroke: #34464F; }
      .line { stroke: #F2F4F1; }
      .rail { stroke: #34464F; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- client and request -->
  <rect class="box" x="16" y="56" width="96" height="48" rx="6"/>
  <text class="fg label" x="64" y="85" text-anchor="middle">client</text>
  <line class="line" x1="114" y1="80" x2="296" y2="80" marker-end="url(#arrow)"/>
  <text class="fg mono" x="205" y="70" text-anchor="middle">GET /assets/app.css</text>
  <text class="muted mono" x="205" y="100" text-anchor="middle">Host: cdn.example.com</text>

  <!-- hylla -->
  <rect class="panel" x="300" y="20" width="500" height="364" rx="10"/>
  <rect class="accent" x="324" y="36" width="12" height="12" rx="2"/>
  <text class="fg title" x="344" y="48">hylla</text>

  <line class="rail" x1="336" y1="96" x2="336" y2="276"/>

  <circle class="accent" cx="336" cy="96" r="12"/>
  <text class="on-accent label" x="336" y="101" text-anchor="middle">1</text>
  <text class="fg label" x="360" y="101">server</text>
  <text class="muted" x="360" y="121">the one whose <tspan class="mono">server_names</tspan> contain the Host</text>

  <circle class="accent" cx="336" cy="156" r="12"/>
  <text class="on-accent label" x="336" y="161" text-anchor="middle">2</text>
  <text class="fg label" x="360" y="161">mapping</text>
  <text class="muted" x="360" y="181">the first whose <tspan class="mono">path_prefix</tspan> matches, rewriting the path to a key</text>

  <circle class="accent" cx="336" cy="216" r="12"/>
  <text class="on-accent label" x="336" y="221" text-anchor="middle">3</text>
  <text class="fg label" x="360" y="221">backend</text>
  <text class="muted" x="360" y="241">the mapping's bucket</text>

  <circle class="accent" cx="336" cy="276" r="12"/>
  <text class="on-accent label" x="336" y="281" text-anchor="middle">4</text>
  <text class="fg label" x="360" y="281">cache</text>

  <!-- cache lookup -->
  <rect class="box" x="360" y="300" width="110" height="44" rx="6"/>
  <text class="fg label" x="415" y="327" text-anchor="middle">memory</text>
  <line class="line" x1="472" y1="322" x2="536" y2="322" marker-end="url(#arrow)"/>
  <text class="muted" x="505" y="314" text-anchor="middle">miss</text>
  <rect class="box" x="540" y="300" width="110" height="44" rx="6"/>
  <text class="fg label" x="595" y="327" text-anchor="middle">disk</text>
  <text class="muted" x="360" y="368">a hit is served from memory or disk</text>

  <!-- bucket -->
  <line class="line" x1="652" y1="322" x2="856" y2="322" marker-end="url(#arrow)"/>
  <text class="muted" x="754" y="314" text-anchor="middle">miss: fetch the chunks</text>
  <rect class="box" x="860" y="300" width="120" height="44" rx="6"/>
  <text class="fg label" x="920" y="327" text-anchor="middle">bucket</text>
</svg>
